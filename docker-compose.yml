services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aventra}
      MYSQL_USER: ${DB_USERNAME:-aventra}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aventra_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./aventra_-main
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Aventra}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8002}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-aventra}
      DB_USERNAME: ${DB_USERNAME:-aventra}
      DB_PASSWORD: ${DB_PASSWORD:-aventra_password}
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3002,127.0.0.1:3002}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - laravel-storage:/var/www/html/storage
    ports:
      - "${BACKEND_PORT:-8002}:80"

  frontend:
    build:
      context: ./qaztour-main
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
    ports:
      - "${FRONTEND_PORT:-3002}:80"

volumes:
  mysql-data:
  laravel-storage:
